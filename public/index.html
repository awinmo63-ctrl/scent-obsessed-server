<style>
:root{--bone:#F4EFE7;--bone2:#ECE4D6;--ink:#1A1714;--ink2:#2C2822;--muted:#655D52;--line:#DED4C4;--cognac:#8A5A2C;--cognac2:#B27E48;--tap:46px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bone);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:16px}
img{max-width:100%;height:auto}
.display{font-family:'Fraunces',serif;font-optical-sizing:auto}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;font-size:16px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--tap);padding:15px 28px;background:var(--ink);color:var(--bone);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid var(--ink);transition:.35s;cursor:pointer;text-align:center}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.announce{background:var(--ink);color:var(--bone);overflow:hidden;white-space:nowrap;padding:9px 0}
.announce .track{display:inline-block;animation:marq 34s linear infinite;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#CDBFA6}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
nav{position:sticky;top:0;z-index:50;background:rgba(244,239,231,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.burger{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;margin-left:-12px}
.burger i{display:block;width:20px;height:1.5px;background:var(--ink);position:relative}
.burger i::before,.burger i::after{content:'';position:absolute;left:0;width:20px;height:1.5px;background:var(--ink)}
.burger i::before{top:-6px}.burger i::after{top:6px}
.nav-links{display:none;gap:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.nav-links a{color:var(--ink2);cursor:pointer}
.nav-links a:hover{color:var(--cognac)}
.brand{font-family:'Manrope',sans-serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;cursor:pointer;white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:4px}
.nav-right button{min-width:var(--tap);height:var(--tap);background:none;border:none;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:0 8px}
.nav-right button:hover{color:var(--cognac)}
.hero{padding:34px 0 10px}
.hero-visual{position:relative;height:min(52vh,380px);display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.halo{position:absolute;width:min(78vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff8ec 0%,var(--bone2) 55%,transparent 72%);filter:blur(6px)}
.hero-bottle{position:relative;max-height:100%;width:auto;z-index:2;filter:drop-shadow(0 34px 44px rgba(26,23,20,.32));animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hero h1{font-size:clamp(40px,11vw,104px);line-height:.96;font-weight:400;letter-spacing:-.01em;margin-top:14px}
.hero h1 em{font-style:italic;color:var(--cognac)}
.hero .lede{max-width:430px;margin:20px 0 26px;color:var(--muted);font-size:16px;line-height:1.68}
.hero-cta{display:flex;gap:12px;flex-direction:column}
.meta-row{display:flex;gap:22px;border-top:1px solid var(--line);margin-top:30px;padding-top:22px;flex-wrap:wrap}
.meta-row .k{font-family:'Fraunces',serif;font-size:22px}
.meta-row .v{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.trustbar{background:var(--ink);color:#CDBFA6;padding:18px 0}
.trustbar .tg{display:grid;grid-template-columns:1fr;gap:12px;text-align:center}
.trustbar .ti{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.trustbar .ti b{color:var(--bone);font-weight:600}
.sec{padding:64px 0}
.sec-head{margin-bottom:34px;border-bottom:1px solid var(--line);padding-bottom:18px}

.grid4{display:grid;grid-template-columns:1fr 1fr;border-left:1px solid var(--line)}
.card{border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-top:1px solid var(--line);padding:18px 14px 16px;position:relative;cursor:pointer;background:transparent;transition:.4s}
.card:active{background:#fff}
.card .idx{position:absolute;top:12px;right:12px;font-size:10px;color:var(--muted)}
.card-img{height:clamp(140px,34vw,300px);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.card-img img{max-height:100%;width:auto;filter:drop-shadow(0 16px 20px rgba(26,23,20,.2))}
.card h3{font-family:'Fraunces',serif;font-size:clamp(16px,4.4vw,22px);font-weight:500;margin-bottom:4px;line-height:1.2}
.card .tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cognac);margin-bottom:8px;min-height:24px}
.card .price{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:8px;gap:6px}
.card .amt{font-family:'Fraunces',serif;font-size:15px}
.card .addbtn{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:none;border:none;cursor:pointer;padding:8px 0 8px 8px;font-weight:600;white-space:nowrap}
/* scent guide */
.guide{border:1px solid var(--line);background:#fff}
.grow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:0;border-bottom:1px solid var(--line);align-items:center}
.grow:last-child{border-bottom:none}
.grow>div{padding:14px 12px;font-size:12px}
.grow.hd>div{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--bone2)}
.grow .gn{font-family:'Fraunces',serif;font-size:15px;cursor:pointer}
.grow .gn small{display:block;font-family:'Manrope',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cognac);margin-top:3px}
.story{background:var(--ink);color:var(--bone);padding:74px 0}
.story .eyebrow{color:var(--cognac2)}
.story blockquote{font-family:'Fraunces',serif;font-size:clamp(24px,6.4vw,46px);line-height:1.26;font-weight:300;max-width:940px;margin-top:22px}
.story blockquote em{font-style:italic;color:var(--cognac2)}
.story .sig{margin-top:28px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9C9285}
.pillars{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.pillar{padding:30px 0;border-bottom:1px solid var(--line)}
.pillar .n{font-family:'Fraunces',serif;font-size:14px;color:var(--cognac);margin-bottom:12px}
.pillar h4{font-family:'Fraunces',serif;font-size:21px;font-weight:500;margin-bottom:10px}
.pillar p{color:var(--muted);font-size:14px;line-height:1.7}
.faq{border-top:1px solid var(--line)}
.fq{border-bottom:1px solid var(--line)}
.fq button{width:100%;text-align:left;background:none;border:none;padding:18px 30px 18px 0;font-size:15px;font-family:'Fraunces',serif;cursor:pointer;position:relative;color:var(--ink)}
.fq button::after{content:'+';position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--cognac);font-size:18px;font-family:'Manrope',sans-serif}
.fq.open button::after{content:'−'}
.fq .fa{display:none;padding:0 0 18px;color:var(--muted);font-size:14px;line-height:1.75}
.fq.open .fa{display:block}
.loyal{background:var(--bone2);border:1px solid var(--line);padding:32px 22px;text-align:center}
.ring{width:170px;height:170px;border-radius:50%;border:1px solid var(--cognac);display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#fff,transparent);position:relative;overflow:hidden;margin:0 auto 26px}
.ring .fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(178,126,72,.32),rgba(138,90,44,.5));transition:height 1s}
.ring .big{font-family:'Fraunces',serif;font-size:40px;color:var(--cognac);position:relative;z-index:2}
.ring .sm{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);position:relative;z-index:2}
.loyal h3{font-family:'Fraunces',serif;font-size:28px;font-weight:400;margin-bottom:12px}
.loyal p{color:var(--muted);line-height:1.7;margin:0 auto 24px;max-width:420px;font-size:14px}
footer{background:var(--ink);color:#B7AD9E;padding:56px 0 30px}
.foot-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding-bottom:34px;border-bottom:1px solid #35302A}
.foot-brand{grid-column:1/-1}
footer .fbrand{font-family:'Fraunces',serif;font-size:26px;color:var(--bone);letter-spacing:.06em}
footer .fbrand+p{margin-top:12px;max-width:300px;font-size:13.5px;line-height:1.7}
footer h5{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone);margin-bottom:14px}
footer ul{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
footer ul span{cursor:pointer}
footer ul span:hover{color:var(--cognac2)}
.foot-bot{display:flex;flex-direction:column;gap:8px;padding-top:20px;font-size:11px;color:#7C7367}
/* product */
.crumb{padding:18px 0 0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crumb span{cursor:pointer}
.pd{display:grid;grid-template-columns:1fr;gap:24px;padding:16px 0 40px}
.stage{position:relative;background:linear-gradient(160deg,#fff,var(--bone2));border:1px solid var(--line);height:min(58vh,460px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage img{max-height:88%;width:auto;z-index:2;filter:drop-shadow(0 30px 36px rgba(26,23,20,.28))}
.stage model-viewer{width:100%;height:100%;background:transparent;z-index:2;--poster-color:transparent}
.stage .no{position:absolute;top:14px;left:14px;font-size:10px;letter-spacing:.18em;color:var(--muted);z-index:3}
.toggles{display:flex;gap:8px;margin-top:10px}
.toggles button{flex:1;min-height:44px;background:transparent;border:1px solid var(--line);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.toggles button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.info .tag{color:var(--cognac);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;margin-bottom:10px}
.info h1{font-size:clamp(34px,9vw,66px);font-weight:400;line-height:1.02;margin-bottom:14px}
.pprice{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pprice .pv{font-family:'Fraunces',serif;font-size:26px}
.pprice small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.perml{font-size:12px;color:var(--muted);margin-bottom:18px}
.info .intro{color:var(--muted);font-size:15.5px;line-height:1.72;margin-bottom:24px}
.buyrow{display:flex;gap:10px;margin-bottom:12px}
.qty{display:flex;align-items:center;border:1px solid var(--ink);flex-shrink:0}
.qty button{width:44px;height:44px;background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--ink)}
.qty span{width:36px;text-align:center;font-family:'Fraunces',serif}
.ship-line{font-size:12.5px;color:var(--muted);margin-bottom:26px;line-height:1.6}
.ship-line b{color:var(--ink)}
.specs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:30px}
.specs .s{flex:1;padding:16px 0;border-right:1px solid var(--line);text-align:center}
.specs .s:last-child{border-right:none}
.specs .k{font-family:'Fraunces',serif;font-size:19px}
.specs .v{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.notes h3{font-family:'Fraunces',serif;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--cognac);margin-bottom:16px}
.layer{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:baseline}
.layer:last-child{border-bottom:1px solid var(--line)}
.lname{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lval{font-family:'Fraunces',serif;font-size:16px;line-height:1.4}
.composition{background:var(--ink);color:var(--bone);padding:64px 0}
.composition .eyebrow{color:var(--cognac2)}
.composition h2{font-family:'Fraunces',serif;font-size:clamp(24px,6vw,40px);font-weight:300;margin:18px 0 24px;max-width:760px;line-height:1.25}
.composition p{color:#C9BFB0;font-size:15px;line-height:1.85;max-width:720px;white-space:pre-line}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(244,239,231,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
.buybar .bp{flex-shrink:0}
.buybar .bp .bn{font-family:'Fraunces',serif;font-size:15px;line-height:1.1}
.buybar .bp .bs{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.buybar .btn{flex:1;padding:14px 16px}
/* drawers/modals */
.scrim{position:fixed;inset:0;background:rgba(26,23,20,.55);backdrop-filter:blur(3px);z-index:90;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bone);z-index:91;display:flex;flex-direction:column;animation:slide .35s cubic-bezier(.2,.7,.2,1);border-left:1px solid var(--line)}
.drawer.left{right:auto;left:0;border-left:none;border-right:1px solid var(--line);animation:slideL .35s cubic-bezier(.2,.7,.2,1);width:min(320px,86%)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideL{from{transform:translateX(-100%)}to{transform:none}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.drawer-head h3{font-family:'Fraunces',serif;font-size:19px;font-weight:500}
.drawer-head button{width:44px;height:44px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);margin-right:-10px}
.drawer-body{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch}
.drawer-foot{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));flex-shrink:0}

.citem .cp{font-size:12.5px;color:var(--cognac);margin-bottom:8px}
.rm{background:none;border:none;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;padding:6px 0;margin-left:auto}
.trow{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--muted)}
.trow.tot{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;color:var(--ink);font-family:'Fraunces',serif;font-size:19px}
.saveline{background:rgba(138,90,44,.09);border:1px solid rgba(138,90,44,.3);padding:9px 12px;font-size:11.5px;color:var(--cognac);letter-spacing:.04em;margin-bottom:12px;text-align:center}
.modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:95}
.mbox{background:var(--bone);border-top:1px solid var(--line);width:100%;max-width:440px;padding:30px 22px calc(30px + env(safe-area-inset-bottom));text-align:center;animation:up .35s cubic-bezier(.2,.7,.2,1);max-height:92vh;overflow-y:auto}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.mbox h2{font-family:'Fraunces',serif;font-size:25px;font-weight:400;margin-bottom:10px;line-height:1.15}
.mbox p{color:var(--muted);font-size:14px;line-height:1.68;margin-bottom:20px}
.field{width:100%;background:#fff;border:1px solid var(--line);padding:14px;font-size:16px;color:var(--ink);outline:none;margin-bottom:10px;min-height:var(--tap)}
.field:focus{border-color:var(--cognac)}
.checkout{position:fixed;inset:0;background:var(--bone);z-index:96;overflow-y:auto;-webkit-overflow-scrolling:touch}
.co-head{display:flex;align-items:center;justify-content:center;position:relative;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bone);z-index:2}

function calcTotals(cart,promo){
  let subtotal=0;
  cart.forEach(i=>{ if(!i.isReward) subtotal+=(i.priceNum||0)*i.qty; });
  let finalTotal=subtotal, discount=0;
  if(promo){
    if(promo.type==='FIXED_PRICE'){
      let t=0; cart.forEach(i=>{ if(!i.isReward) t+=promo.pricePerItem*i.qty; });
      finalTotal=t; discount=subtotal-t;
    } else if(promo.type==='FIXED_TOTAL'){
      finalTotal=promo.fixedTotal; discount=subtotal-promo.fixedTotal;
    } else { discount=Math.floor(subtotal*((promo.discount||0)/100)); finalTotal=subtotal-discount; }
  }
  if(discount<0) discount=0;
  if(finalTotal<0) finalTotal=0;
  return {subtotal,discount,finalTotal};
}

const ReviewForm=({onDone,notify})=>{
  const [open,setOpen]=useState(false);
  const [rating,setRating]=useState(0);
  const [name,setName]=useState('');const [city,setCity]=useState('');
  const [email,setEmail]=useState('');const [body,setBody]=useState('');
  const [busy,setBusy]=useState(false);
  if(!open) return h('div',{style:{textAlign:'center',padding:'26px 0'}},
    h('button',{className:'btn ghost',onClick:()=>setOpen(true)},'Write a Review'));
  const submit=async()=>{
    if(!rating){notify('Please choose a rating');return;}
    if(!name.trim()||body.trim().length<10){notify('Add your name and a few words');return;}
    setBusy(true);
    try{
      const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({customer_name:name,customer_city:city,email:email,rating:rating,body:body})});
      const d=await r.json();
      if(d&&d.success){notify('Thank you — your review will appear once approved.');setOpen(false);onDone&&onDone();}
      else notify((d&&d.error)||'Could not submit right now');
    }catch(e){notify('Could not submit right now');}
    setBusy(false);
  };
  return h('div',{style:{maxWidth:'440px',margin:'26px auto 0',border:'1px solid var(--line)',background:'#fff',padding:'22px'}},
    h('p',{className:'eyebrow',style:{textAlign:'center',marginBottom:'12px'}},'Share your experience'),
    h('div',{className:'starpick'},[1,2,3,4,5].map(n=>h('button',{key:n,className:rating>=n?'on':'',
      onClick:()=>setRating(n),'aria-label':n+' stars'},'★'))),
    h('input',{className:'field',placeholder:'Your name',value:name,onChange:e=>setName(e.target.value)}),
    h('input',{className:'field',placeholder:'City (optional)',value:city,onChange:e=>setCity(e.target.value)}),
    h('input',{className:'field',placeholder:'Email used for your order (optional)',type:'email',value:email,onChange:e=>setEmail(e.target.value)}),
    h('textarea',{className:'field',rows:4,placeholder:'What did you think of the fragrance?',value:body,onChange:e=>setBody(e.target.value)}),
    h('p',{style:{fontSize:'11px',color:'var(--muted)',marginBottom:'12px'}},'Reviews are published after a quick check. Adding your order email marks you a verified buyer.'),
    h('div',{style:{display:'flex',gap:'8px'}},
      h('button',{className:'btn block',disabled:busy,onClick:submit},busy?'Sending…':'Submit Review'),
      h('button',{className:'btn ghost',onClick:()=>setOpen(false)},'Cancel')));
};

const Chat=()=>{
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([{r:'a',t:'Welcome to Scent Obsessed. Tell me what you like and I’ll help you find your signature.'}]);
  const [val,setVal]=useState(''); const [busy,setBusy]=useState(false); const end=useRef(null);
  useEffect(()=>{ if(end.current) end.current.scrollIntoView({behavior:'smooth'}); },[msgs,open]);
  const send=async()=>{
    const m=val.trim(); if(!m||busy) return;
    setMsgs(p=>[...p,{r:'u',t:m}]); setVal(''); setBusy(true);
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
      const d=await r.json();
      setMsgs(p=>[...p,{r:'a',t:d.reply||d.error||'Our concierge is stepping away. Please try again.'}]);
    }catch(e){ setMsgs(p=>[...p,{r:'a',t:'Connection issue. Please try again shortly.'}]); }
    setBusy(false);
  };
  return h(React.Fragment,null,
    h('button',{className:'chat-btn',onClick:()=>setOpen(!open),'aria-label':'Concierge'},open?'×':'✦'),
    open&&h('div',{className:'chat-win'},
      h('div',{className:'chat-h'},'Scent Obsessed Concierge'),
      h('div',{className:'chat-m'},msgs.map((m,i)=>h('div',{key:i,className:'bub '+m.r},m.t)),busy&&h('div',{className:'bub a'},'…'),h('div',{ref:end})),
      h('div',{className:'chat-i'},
        h('input',{value:val,placeholder:'Ask about our perfumes…',onChange:e=>setVal(e.target.value),onKeyDown:e=>{if(e.key==='Enter')send();}}),
        h('button',{onClick:send},'Send'))));
};

const App=()=>{
  const params=new URLSearchParams(window.location.search);
  const [view,setView]=useState(params.get('product')||null);
  const [cart,setCart]=useState(()=>{try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return [];}});
  const [user,setUser]=useState(null);
  const [loyaltyMl,setLoyaltyMl]=useState(0);
  const [orders,setOrders]=useState([]);
  const [cartOpen,setCartOpen]=useState(false);
  const [accOpen,setAccOpen]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);
  const [checkoutOpen,setCheckoutOpen]=useState(false);
  const [promo,setPromo]=useState(null);
  const [note,setNote]=useState(null);
  const [wheelOpen,setWheelOpen]=useState(false);
  const [exitOpen,setExitOpen]=useState(false);
  const [rewardOpen,setRewardOpen]=useState(false);
  const [trackOrder,setTrackOrder]=useState(null);
  const [legal,setLegal]=useState(null);
  const [payState,setPayState]=useState(null);
  const [busy,setBusy]=useState(false);
  const [faqOpen,setFaqOpen]=useState(null);
  const [faqCat,setFaqCat]=useState(0);
  const [reviews,setReviews]=useState([]);
  const [form,setForm]=useState({name:'',email:'',phone:'',street:'',city:'',state:'',pincode:''});
  const promoRef=useRef(null);
  useEffect(()=>{promoRef.current=promo;},[promo]);

  const notify=(m)=>{setNote(m);setTimeout(()=>setNote(null),3000);};
  const loadReviews=async()=>{
    try{ const r=await fetch('/api/reviews'); const d=await r.json();
      if(d&&d.reviews) setReviews(d.reviews); }catch(e){}
  };
  useEffect(()=>{loadReviews();},[]);
  useEffect(()=>{localStorage.setItem(CART_KEY,JSON.stringify(cart));},[cart]);
  useEffect(()=>{ document.body.style.overflow=(cartOpen||accOpen||menuOpen||checkoutOpen)?'hidden':''; },[cartOpen,accOpen,menuOpen,checkoutOpen]);

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{if(session&&session.user)setUser(session.user);});
    const {data:{subscription}}=supabase.auth.onAuthStateChange((_e,s)=>setUser(s&&s.user?s.user:null));
    return ()=>{if(subscription)subscription.unsubscribe();};
  },[]);

  useEffect(()=>{
    if(!user){setOrders([]);setLoyaltyMl(0);return;}
    (async()=>{
      setForm(f=>({...f,email:f.email||user.email||'',name:f.name||(user.user_metadata&&user.user_metadata.full_name)||''}));
      const {data:od}=await supabase.from('orders').select('*').eq('customer_email',user.email).order('created_at',{ascending:false});
      setOrders(od||[]);
      const {data:pf}=await supabase.from('profiles').select('*').eq('email',user.email).single();
      if(pf) setLoyaltyMl(pf.loyalty_ml||0);
      else { try{ await supabase.from('profiles').insert([{id:user.id,email:user.email,loyalty_ml:0}]); }catch(e){} }
    })();
  },[user]);

  useEffect(()=>{
    const oid=params.get('order_id'); if(!oid) return;
    (async()=>{
      try{
        const r=await fetch('/api/verify-payment/'+oid); const d=await r.json();
        if(d.status==='SUCCESS'){setPayState({ok:true,id:oid});setCart([]);setPromo(null);}
        else setPayState({ok:false,id:oid});
      }catch(e){setPayState({ok:false,id:oid});}
      window.history.replaceState({},'',window.location.pathname);
    })();
  },[]);

  useEffect(()=>{
    let fired=false;
    const leave=(e)=>{
      if(fired||e.clientY>0||promoRef.current) return;
      if(sessionStorage.getItem('so_exit')) return;
      fired=true; sessionStorage.setItem('so_exit','1'); setExitOpen(true);
    };
    document.addEventListener('mouseout',leave);
    return ()=>document.removeEventListener('mouseout',leave);
  },[]);

  const cartCount=cart.reduce((s,i)=>s+(i.qty||0),0);
  const addToCart=(p,qty)=>{
    setCart(prev=>{
      const ex=prev.find(i=>i.id===p.id&&!i.isReward);
      if(ex) return prev.map(i=>(i.id===p.id&&!i.isReward)?{...i,qty:i.qty+qty}:i);
      return [...prev,{id:p.id,name:p.name,price:p.price,priceNum:p.priceNum,img:p.img,qty:qty}];
    });
    notify(p.name+' added'); setCartOpen(true);
  };
  const updateQty=(id,d)=>setCart(p=>p.map(i=>i.id===id?{...i,qty:i.qty+d}:i).filter(i=>i.qty>0));
  const removeItem=(id)=>setCart(p=>p.filter(i=>i.id!==id));

  const goHome=(a)=>{setView(null);window.history.replaceState({},'',window.location.pathname);
    setTimeout(()=>{if(a){const el=document.getElementById(a);if(el)el.scrollIntoView({behavior:'smooth'});}else window.scrollTo(0,0);},60);};
  const openProduct=(id)=>{setView(id);window.history.replaceState({},'','?product='+id);window.scrollTo(0,0);};

  const claimReward=()=>{ if(loyaltyMl>=REWARD_ML) setRewardOpen(true); else notify('Your vessel is not full yet'); };
  const selectReward=(p)=>{
    setCart(prev=>[...prev,{id:'reward-'+p.id,name:p.name+' (Reward)',price:'₹ 0',priceNum:0,img:p.img,qty:1,isReward:true}]);
    setRewardOpen(false); notify('Reward added'); setCartOpen(true);
  };

  const pay=async(amount)=>{
    setBusy(true);
    const paidUnits=cart.reduce((s,i)=>s+(i.isReward?0:i.qty),0);
    const rewardMl=paidUnits*ML_PER_BOTTLE;
    const claimed=cart.some(i=>i.isReward)?REWARD_ML:0;
    const address=JSON.stringify({street:form.street,city:form.city,state:form.state,pincode:form.pincode});
    const items=cart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,isReward:!!i.isReward}));
    try{ await supabase.from('profiles').update({full_name:form.name,phone:form.phone,shipping_address:address}).eq('email',form.email); }catch(e){}
    if(amount<=0){
      const oid='ORDER_'+Date.now();
      try{
        await supabase.from('orders').insert([{order_id:oid,customer_name:form.name,customer_phone:form.phone,customer_email:form.email,
          shipping_address:address,total_amount:0,payment_status:'PAID',reward_ml:rewardMl,claimed_reward_ml:claimed,
          cart_items:items,tracking_status:'PREPARING',applied_promo:promo?promo.code:''}]);
        if(claimed) await supabase.from('profiles').update({loyalty_ml:Math.max(0,loyaltyMl-claimed)}).eq('email',form.email);
      }catch(e){}
      setBusy(false);setCheckoutOpen(false);setCart([]);setPromo(null);setPayState({ok:true,id:oid});return;
    }
    try{
      const res=await fetch('/create-order',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({orderAmount:amount,customerName:form.name,customerPhone:form.phone,customerEmail:form.email,
          shippingAddress:address,rewardMl:rewardMl,claimedRewardMl:claimed,cartItems:items,appliedPromo:promo?promo.code:''})});
      const d=await res.json();
      if(d.payment_session_id&&window.Cashfree){
        const cf=window.Cashfree({mode:'production'});
        cf.checkout({paymentSessionId:d.payment_session_id,redirectTarget:'_self'});
      } else { notify('Could not start payment. Please try again.'); setBusy(false); }
    }catch(e){ notify('Checkout failed. Please try again.'); setBusy(false); }
  };

  const product=view?PRODUCTS.find(p=>p.id===view):null;

  return h(React.Fragment,null,
    h(Announce),
    h(Nav,{cartCount,onCart:()=>setCartOpen(true),onAccount:()=>setAccOpen(true),onHome:goHome,onMenu:()=>setMenuOpen(true)}),
    product
      ? h(ProductView,{p:product,onAdd:addToCart,onHome:goHome,onOpen:openProduct})
      : h(Home,{onOpen:openProduct,onAdd:addToCart,onOpenFaq:setFaqOpen,faqOpen:faqOpen,reviews:reviews,reloadReviews:loadReviews,notify:notify,faqCat:faqCat,setFaqCat:setFaqCat}),
    !product&&h('section',{className:'sec',id:'loyalty',style:{paddingTop:0}},h('div',{className:'wrap'},
      h('div',{className:'loyal'},
        h('div',null,h('div',{className:'ring'},
          h('div',{className:'fill',style:{height:Math.min(100,loyaltyMl)+'%'}}),
          h('div',{className:'big'},user?loyaltyMl:'10'),h('div',{className:'sm'},user?'ML — Your Vessel':'ML per order'))),
        h('div',null,
          h('p',{className:'eyebrow',style:{marginBottom:'12px'}},'Loyalty'),
          h('h3',{className:'display'},'Rewarded for your obsession.'),
          h('p',null,'Every order pours 10ml into your Loyalty Vessel. Refer a friend and earn 10ml more. Fill it to 100ml and claim a full flacon, complimentary.'),
          h('button',{className:'btn',onClick:()=>user?claimReward():setAccOpen(true)},user?'Claim Your Reward':'Join the House'))))),
    h('footer',null,h('div',{className:'wrap'},
      h('div',{className:'foot-grid'},
        h('div',{className:'foot-brand'},h('div',{className:'fbrand'},'Scent Obsessed'),
          h('p',null,'Extrait de parfum, hand-filled in Ludhiana for those who intend to be unforgettable.'),
          WHATSAPP?h('a',{href:'https://wa.me/'+WHATSAPP,target:'_blank',rel:'noopener',
            style:{display:'inline-block',marginTop:'14px',color:'var(--cognac2)',fontSize:'13px',letterSpacing:'.06em'}},'Chat on WhatsApp →'):null,
          h(Newsletter,{notify:notify})),
        h('div',null,h('h5',null,'Shop'),h('ul',null,PRODUCTS.map(p=>h('li',{key:p.id},h('span',{onClick:()=>openProduct(p.id)},p.name))))),
        h('div',null,h('h5',null,'Help'),h('ul',null,
          h('li',null,h('span',{onClick:()=>setLegal('shipping')},'Shipping')),
          h('li',null,h('span',{onClick:()=>setLegal('returns')},'Returns & Refunds')),
          h('li',null,h('span',{onClick:()=>setLegal('contact')},'Contact')))),
        h('div',null,h('h5',null,'Legal'),h('ul',null,
          h('li',null,h('span',{onClick:()=>setLegal('terms')},'Terms')),
          h('li',null,h('span',{onClick:()=>setLegal('privacy')},'Privacy')),
          h('li',null,h('span',{onClick:()=>setLegal('loyalty')},'Loyalty Programme'))))),
      h('div',{className:'foot-bot'},h('span',null,'© 2026 Scent Obsessed · Ludhiana, India'),
        h('span',null,'Secured by Cashfree · Delivered by Shiprocket')))),
    h(MenuDrawer,{open:menuOpen,onClose:()=>setMenuOpen(false),onHome:goHome,onWheel:()=>setWheelOpen(true)}),
    h(CartDrawer,{open:cartOpen,onClose:()=>setCartOpen(false),cart,updateQty,removeItem,promo,
      onCheckout:()=>{if(cart.length===0){notify('Your cart is empty');return;}setCartOpen(false);setCheckoutOpen(true);}}),
    h(AccountDrawer,{open:accOpen,onClose:()=>setAccOpen(false),user,loyaltyMl,orders,
      onLogout:async()=>{await supabase.auth.signOut();setAccOpen(false);notify('Signed out');},
      onTrack:(o)=>{setAccOpen(false);setTrackOrder(o);},notify}),
    h(Checkout,{open:checkoutOpen,onBack:()=>setCheckoutOpen(false),cart,promo,setPromo,form,setForm,onPay:pay,notify,busy}),
    h(Wheel,{open:wheelOpen,onClose:()=>setWheelOpen(false),notify}),
    h(ExitIntent,{open:exitOpen,onClose:()=>setExitOpen(false),onApply:(c)=>{setPromo(SPECIAL[c]);setExitOpen(false);notify('Code '+c+' applied');}}),
    h(RewardPicker,{open:rewardOpen,onClose:()=>setRewardOpen(false),onSelect:selectReward}),
    trackOrder&&h(Tracking,{order:trackOrder,onClose:()=>setTrackOrder(null)}),
    legal&&h(Legal,{topic:legal,onClose:()=>setLegal(null)}),
    payState&&h(Modal,{onClose:()=>setPayState(null)},
      h('h2',{className:'display'},payState.ok?'Order Confirmed':'Payment Not Completed'),
      h('p',null,payState.ok
        ?'Thank you. Order '+payState.id+' is confirmed. We’ll dispatch within 24–48 hours and send tracking to your email.'
        :'We could not confirm your payment. If money was debited it will be refunded automatically within 5–7 business days.'),
      h('button',{className:'btn block',onClick:()=>setPayState(null)},payState.ok?'Continue':'Close')),
    user&&!product&&h('div',{className:'vfloat'},
      h('div',{className:'vt'},'Loyalty Vessel'),
      h('div',{className:'bar'},h('i',{style:{width:Math.min(100,loyaltyMl)+'%'}})),
      h('div',{className:'vm'},loyaltyMl+' / 100 ML'),
      loyaltyMl>=REWARD_ML&&!cart.some(i=>i.isReward)&&h('button',{onClick:claimReward},'Claim Reward')),
    h(Chat),
    h('div',{className:'toast'+(note?' show':'')},note||''));
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
