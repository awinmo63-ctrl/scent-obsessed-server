function calcTotals(cart, promo){
  let subtotal = 0;
  cart.forEach(i => { if(!i.isReward) subtotal += (i.priceNum||0) * i.qty; });
  let finalTotal = subtotal, discount = 0;
  if(promo){
    if(promo.type === 'FIXED_PRICE'){
      let t = 0; cart.forEach(i => { if(!i.isReward) t += promo.pricePerItem * i.qty; });
      finalTotal = t; discount = subtotal - t;
    } else if(promo.type === 'FIXED_TOTAL'){
      finalTotal = promo.fixedTotal; discount = subtotal - promo.fixedTotal;
    } else {
      discount = Math.floor(subtotal * ((promo.discount||0)/100));
      finalTotal = subtotal - discount;
    }
  }
  if(discount < 0) discount = 0;
  if(finalTotal < 0) finalTotal = 0;
  return { subtotal, discount, finalTotal };
}

  if(!open) return null;
  const {subtotal,discount,finalTotal} = calcTotals(cart,promo);
  const applyPromo = async () => {
    const c = code.trim().toUpperCase();
    if(!c) return;
    if(SPECIAL[c]){ setPromo(SPECIAL[c]); notify('Code '+c+' applied'); setCode(''); return; }
    try{
      const {data} = await supabase.from('promo_codes').select('*').eq('code',c).single();
      if(!data){ notify('Invalid code'); return; }
      if(data.is_used){ notify('This code has already been used'); return; }
      setPromo({type:'PERCENTAGE',discount:data.discount_percentage||0,code:c});
      notify('Code '+c+' applied'); setCode('');
    }catch(e){ notify('Invalid code'); }
  };
  const set = (k,v) => setForm(prev=>({...prev,[k]:v}));

  const [phone,setPhone] = useState(''); const [spinning,setSpinning] = useState(false); const [result,setResult] = useState(null);
  useEffect(()=>{ if(open){setPhone('');setResult(null);setSpinning(false);} },[open]);
  if(!open) return null;
  const spin = async () => {
    if(phone.length<10){ notify('Enter a valid 10-digit number'); return; }
    setSpinning(true);
    const r = Math.random()*100; let prize;
    if(r<=50) prize={text:'Any bottle at ₹1,499',code:'VIP1499'};
    else if(r<=75) prize={text:'50% off your order',code:'HALF50'};
    else if(r<=99) prize={text:'Any bottle at ₹720',code:'VIP720'};
    else prize={text:'No prize this time',code:null};
    try{ await supabase.from('wheel_leads').insert([{phone:phone,prize_won:prize.text}]); }catch(e){}
    setTimeout(()=>{ setResult(prize); setSpinning(false); },2200);
  };
  return h(Modal,{onClose},
    h('p',{className:'eyebrow',style:{marginBottom:'10px'}},'Members Vault'),
    !result
      ? h(React.Fragment,null,
          h('h2',{className:'display'},'Unlock the Vault'),
          h('p',null,'Enter your number to reveal a private offer reserved for the obsessed.'),
          h('input',{className:'field',placeholder:'10-digit mobile number',inputMode:'numeric',value:phone,
            onChange:e=>setPhone(e.target.value.replace(/\D/g,'').slice(0,10))}),
          h('button',{className:'btn block',disabled:spinning,onClick:spin}, spinning?'Decrypting Vault…':'Reveal My Offer'))
      : h(React.Fragment,null,
          h('h2',{className:'display'},result.code?'The Vault Opens':'Sealed For Now'),
          h('p',null,result.text),
          result.code
            ? h(React.Fragment,null,
                h('div',{style:{border:'1px dashed var(--cognac)',padding:'16px',fontFamily:'monospace',fontSize:'20px',letterSpacing:'.2em',color:'var(--cognac)',marginBottom:'20px'}},result.code),
                h('button',{className:'btn block',onClick:()=>{navigator.clipboard.writeText(result.code);notify('Code '+result.code+' copied');onClose();}},'Copy Code & Continue'))
            : h('button',{className:'btn ghost block',onClick:onClose},'Continue to Store')));
};

const ExitIntent = ({open,onClose,onApply}) => {
  const [step,setStep] = useState(1);
  useEffect(()=>{ if(open) setStep(1); },[open]);
  if(!open) return null;
  const pick = async (reason) => { try{ await supabase.from('exit_survey_responses').insert([{reason}]); }catch(e){} setStep(2); };
  return h(Modal,{onClose},
    step===1
      ? h(React.Fragment,null,
          h('h2',{className:'display'},'Before you go'),
          h('p',null,'What held you back today?'),
          ['Price','Just browsing','Shipping time','Not sure which scent'].map(r=>
            h('button',{key:r,className:'btn ghost block',style:{marginBottom:'8px'},onClick:()=>pick(r)},r)))
      : h(React.Fragment,null,
          h('h2',{className:'display'},'Then take 10% with you'),
          h('p',null,'A private code, valid on your first acquisition.'),
          h('div',{style:{border:'1px dashed var(--cognac)',padding:'16px',fontFamily:'monospace',fontSize:'22px',letterSpacing:'.2em',color:'var(--cognac)',marginBottom:'20px'}},'VIP10'),
          h('button',{className:'btn block',onClick:()=>onApply('VIP10')},'Apply & Continue'),
          h('button',{className:'btn ghost block',style:{marginTop:'8px'},onClick:onClose},'No thank you')));
};

const RewardPicker = ({open,onClose,onSelect}) => open ? h(Modal,{onClose},
  h('p',{className:'eyebrow',style:{marginBottom:'10px'}},'Vessel Full'),
  h('h2',{className:'display'},'Select Your Reward'),
  h('p',null,'Your vessel has reached 100ml. Choose a flacon, complimentary.'),
  PRODUCTS.map(p=>h('button',{key:p.id,className:'btn ghost block',style:{marginBottom:'8px'},onClick:()=>onSelect(p)},p.name))
) : null;

const Tracking = ({order,onClose}) => {
  if(!order) return null;
  const steps = [
    {k:'PREPARING',l:'Preparing',d:'Your flacon is being prepared in Ludhiana.'},
    {k:'SHIPPED',l:'Dispatched',d: order.awb_code ? ('AWB ' + order.awb_code) : 'Handed to our courier partner.'},
    {k:'DELIVERED',l:'Delivered',d:'Enjoy your obsession.'}
  ];
  const idx = order.tracking_status==='DELIVERED'?2:order.tracking_status==='SHIPPED'?1:0;
  return h(Modal,{onClose},
    h('p',{className:'eyebrow',style:{marginBottom:'10px'}},'Dossier '+order.order_id),
    h('h2',{className:'display'},'Track Your Order'),
    h('div',{className:'track-steps'}, steps.map((s,i)=>h('div',{className:'tstep',key:s.k},
      h('div',{className:'tdot'+(i<=idx?' on':'')}),
      h('div',null,h('div',{className:'tl'},s.l),h('div',{className:'td'},s.d))))),
    h('button',{className:'btn ghost block',onClick:onClose},'Close'));
};

const Legal = ({topic,onClose}) => {
  if(!topic) return null;
  const C = {
    shipping:{t:'Shipping & Delivery',b:'All orders are dispatched via tracked, insured Shiprocket delivery within 24–48 hours of confirmation. Standard delivery takes 3–5 business days across India. Shipping is complimentary on every order. Our courier partners make up to three delivery attempts; after three unsuccessful attempts the package is returned to origin.'},
    returns:{t:'Returns',b:'Due to the nature of fragrance, we accept returns only on unopened, sealed flacons within 7 days of delivery. If your order arrives damaged, contact us within 48 hours with photographs and we will replace it at no cost.'},
    contact:{t:'Contact',b:'For any question about an order, delivery, or fragrance selection, write to info@scentobsessed.in and our team will respond within one business day.'},
    story:{t:'Our Craft',b:'Scent Obsessed composes extrait de parfum at 30% concentration — the highest tier of fragrance, far richer than eau de parfum. Every flacon is hand-filled in Ludhiana in small batches, so what reaches you is dense, long-wearing, and unmistakably yours.'},
    loyalty:{t:'Loyalty Programme',b:'Every acquisition pours 10ml into your Loyalty Vessel. Refer a friend and earn a further 10ml when they secure their first order. When your vessel reaches 100ml, claim any signature flacon, complimentary.'}
  }[topic];
  return h(Modal,{onClose},
    h('h2',{className:'display'},C.t),
    h('p',{style:{textAlign:'left'}},C.b),
    h('button',{className:'btn ghost block',onClick:onClose},'Close'));
};

const Chat = () => {
  const [open,setOpen] = useState(false);
  const [msgs,setMsgs] = useState([{r:'a',t:'Welcome to Scent Obsessed. How may I help you find your signature?'}]);
  const [val,setVal] = useState(''); const [busy,setBusy] = useState(false);
  const endRef = useRef(null);
  useEffect(()=>{ if(endRef.current) endRef.current.scrollIntoView({behavior:'smooth'}); },[msgs,open]);
  const send = async () => {
    const m = val.trim(); if(!m||busy) return;
    setMsgs(p=>[...p,{r:'u',t:m}]); setVal(''); setBusy(true);
    try{
      const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
      const d = await res.json();
      setMsgs(p=>[...p,{r:'a',t:d.reply||d.error||'Our concierge is stepping away. Please try again.'}]);
    }catch(e){ setMsgs(p=>[...p,{r:'a',t:'Connection issue. Please try again shortly.'}]); }
    setBusy(false);
  };
  return h(React.Fragment,null,
    h('button',{className:'chat-btn',onClick:()=>setOpen(!open),title:'Concierge'}, open?'×':'✦'),
    open && h('div',{className:'chat-win'},
      h('div',{className:'chat-h'},'Scent Obsessed Concierge'),
      h('div',{className:'chat-m'}, msgs.map((m,i)=>h('div',{key:i,className:'bub '+m.r},m.t)),
        busy && h('div',{className:'bub a'},'…'), h('div',{ref:endRef})),
      h('div',{className:'chat-i'},
        h('input',{value:val,placeholder:'Ask about our perfumes…',onChange:e=>setVal(e.target.value),onKeyDown:e=>{if(e.key==='Enter')send();}}),
        h('button',{onClick:send},'Send'))));
};

/* ---------- app ---------- */
const App = () => {
  const params = new URLSearchParams(window.location.search);
  const [view,setView] = useState(params.get('product')||null);
  const [cart,setCart] = useState(()=>{ try{ return JSON.parse(localStorage.getItem(CART_KEY))||[]; }catch(e){ return []; } });
  const [user,setUser] = useState(null);
  const [loyaltyMl,setLoyaltyMl] = useState(0);
  const [orders,setOrders] = useState([]);
  const [cartOpen,setCartOpen] = useState(false);
  const [accOpen,setAccOpen] = useState(false);
  const [checkoutOpen,setCheckoutOpen] = useState(false);
  const [promo,setPromo] = useState(null);
  const [note,setNote] = useState(null);
  const [wheelOpen,setWheelOpen] = useState(false);
  const [exitOpen,setExitOpen] = useState(false);
  const [rewardOpen,setRewardOpen] = useState(false);
  const [trackOrder,setTrackOrder] = useState(null);
  const [legal,setLegal] = useState(null);
  const [payState,setPayState] = useState(null);
  const [busy,setBusy] = useState(false);
  const [form,setForm] = useState({name:'',email:'',phone:'',street:'',city:'',state:'',pincode:''});

  const notify = (m) => { setNote(m); setTimeout(()=>setNote(null),3200); };
  useEffect(()=>{ localStorage.setItem(CART_KEY,JSON.stringify(cart)); },[cart]);

  // auth
  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{ if(session&&session.user) setUser(session.user); });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_e,s)=>setUser(s&&s.user?s.user:null));
    return ()=>{ if(subscription) subscription.unsubscribe(); };
  },[]);

  // profile + orders
  useEffect(()=>{
    if(!user) { setOrders([]); setLoyaltyMl(0); return; }
    (async()=>{
      setForm(f=>({...f,email:f.email||user.email||'',name:f.name||(user.user_metadata&&user.user_metadata.full_name)||''}));
      const {data:od} = await supabase.from('orders').select('*').eq('customer_email',user.email).order('created_at',{ascending:false});
      setOrders(od||[]);
      const {data:pf} = await supabase.from('profiles').select('*').eq('email',user.email).single();
      if(pf) setLoyaltyMl(pf.loyalty_ml||0);
      else { try{ await supabase.from('profiles').insert([{id:user.id,email:user.email,loyalty_ml:0}]); }catch(e){} }
    })();
  },[user]);

  // payment return
  useEffect(()=>{
    const oid = params.get('order_id');
    if(!oid) return;
    (async()=>{
      try{
        const r = await fetch('/api/verify-payment/'+oid);
        const d = await r.json();
        if(d.status==='SUCCESS'){ setPayState({ok:true,id:oid}); setCart([]); setPromo(null); }
        else setPayState({ok:false,id:oid});
      }catch(e){ setPayState({ok:false,id:oid}); }
      window.history.replaceState({},'',window.location.pathname);
    })();
  },[]);

  // exit intent
  useEffect(()=>{
    let fired = false;
    const onLeave = (e) => {
      if(fired||e.clientY>0) return;
      if(sessionStorage.getItem('so_exit')) return;
      fired = true; sessionStorage.setItem('so_exit','1'); setExitOpen(true);
    };
    document.addEventListener('mouseout',onLeave);
    return ()=>document.removeEventListener('mouseout',onLeave);
  },[]);

  const cartCount = cart.reduce((s,i)=>s+(i.qty||0),0);

  const addToCart = (p,qty) => {
    setCart(prev=>{
      const ex = prev.find(i=>i.id===p.id && !i.isReward);
      if(ex) return prev.map(i=>(i.id===p.id&&!i.isReward)?{...i,qty:i.qty+qty}:i);
      return [...prev,{id:p.id,name:p.name,price:p.price,priceNum:p.priceNum,img:p.img,qty:qty}];
    });
    notify(p.name+' added to cart'); setCartOpen(true);
  };
  const updateQty = (id,d) => setCart(prev=>prev.map(i=>i.id===id?{...i,qty:i.qty+d}:i).filter(i=>i.qty>0));

  const goHome = (anchor) => {
    setView(null); window.history.replaceState({},'',window.location.pathname);
    setTimeout(()=>{ if(anchor){ const el=document.getElementById(anchor); if(el) el.scrollIntoView({behavior:'smooth'}); } else window.scrollTo(0,0); },60);
  };
  const openProduct = (id) => { setView(id); window.history.replaceState({},'','?product='+id); window.scrollTo(0,0); };

  const claimReward = () => { if(loyaltyMl>=REWARD_ML) setRewardOpen(true); else notify('Your vessel is not full yet'); };
  const selectReward = (p) => {
    setCart(prev=>[...prev,{id:'reward-'+p.id,name:p.name+' (Reward)',price:'₹ 0',priceNum:0,img:p.img,qty:1,isReward:true}]);
    setRewardOpen(false); notify('Reward added to your cart'); setCartOpen(true);
  };

  const pay = async (amount) => {
    setBusy(true);
    const paidUnits = cart.reduce((s,i)=>s+(i.isReward?0:i.qty),0);
    const rewardMl = paidUnits * ML_PER_BOTTLE;
    const claimed = cart.some(i=>i.isReward) ? REWARD_ML : 0;
    const address = JSON.stringify({street:form.street,city:form.city,state:form.state,pincode:form.pincode});
    const items = cart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty,isReward:!!i.isReward}));
    try{
      await supabase.from('profiles').update({full_name:form.name,phone:form.phone,shipping_address:address}).eq('email',form.email);
    }catch(e){}
    // fully-covered order (reward only) — no gateway needed
    if(amount<=0){
      const oid = 'ORDER_' + Date.now();
      try{
        await supabase.from('orders').insert([{order_id:oid,customer_name:form.name,customer_phone:form.phone,customer_email:form.email,
          shipping_address:address,total_amount:0,payment_status:'PAID',reward_ml:rewardMl,claimed_reward_ml:claimed,
          cart_items:items,tracking_status:'PREPARING',applied_promo:promo?promo.code:''}]);
        if(claimed) await supabase.from('profiles').update({loyalty_ml:Math.max(0,loyaltyMl-claimed)}).eq('email',form.email);
      }catch(e){}
      setBusy(false); setCheckoutOpen(false); setCart([]); setPromo(null); setPayState({ok:true,id:oid}); return;
    }
    try{
      const res = await fetch('/create-order',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({orderAmount:amount,customerName:form.name,customerPhone:form.phone,customerEmail:form.email,
          shippingAddress:address,rewardMl:rewardMl,claimedRewardMl:claimed,cartItems:items,appliedPromo:promo?promo.code:''})});
      const d = await res.json();
      if(d.payment_session_id && window.Cashfree){
        const cf = window.Cashfree({mode:'production'});
        cf.checkout({paymentSessionId:d.payment_session_id,redirectTarget:'_self'});
      } else {
        notify('Could not start payment. Please try again.'); setBusy(false);
      }
    }catch(e){ notify('Checkout failed. Please try again.'); setBusy(false); }
  };

  const product = view ? PRODUCTS.find(p=>p.id===view) : null;

  return h(React.Fragment,null,
    h(Announce),
    h(Nav,{cartCount,onCart:()=>setCartOpen(true),onAccount:()=>setAccOpen(true),onHome:goHome,onWheel:()=>setWheelOpen(true)}),
    product
      ? h(ProductView,{p:product,onAdd:addToCart,onHome:goHome,onOpen:openProduct})
      : h(Home,{onOpen:openProduct,onAdd:addToCart}),
    !product && h('section',{className:'sec',id:'loyalty',style:{paddingTop:0}},h('div',{className:'wrap'},
      h('div',{className:'loyal'},
        h('div',{className:'vessel'},h('div',{className:'ring'},
          h('div',{className:'fill',style:{height:Math.min(100,loyaltyMl)+'%'}}),
          h('div',{className:'big'},loyaltyMl||100),h('div',{className:'sm'},'ML — Vessel'))),
        h('div',null,
          h('p',{className:'eyebrow',style:{marginBottom:'14px'}},'Members Only'),
          h('h3',{className:'display'},'Rewarded for your obsession.'),
          h('p',null,'Every purchase pours 10ml into your Loyalty Vessel. Refer a friend, earn 10ml more. Fill it to 100ml and claim a full flacon on us.'),
          h('button',{className:'btn',onClick:()=>user?claimReward():setAccOpen(true)}, user?'Claim Your Reward':'Join the House')))
    )),
    h(Footer,{onNav:openProduct,onLegal:setLegal}),
    h(CartDrawer,{open:cartOpen,onClose:()=>setCartOpen(false),cart,updateQty,promo,
      onCheckout:()=>{ if(cart.length===0){notify('Your cart is empty');return;} setCartOpen(false); setCheckoutOpen(true); }}),
    h(AccountDrawer,{open:accOpen,onClose:()=>setAccOpen(false),user,loyaltyMl,orders,
      onLogout:async()=>{ await supabase.auth.signOut(); setAccOpen(false); notify('Signed out'); },
      onTrack:(o)=>{ setAccOpen(false); setTrackOrder(o); },notify}),
    h(Checkout,{open:checkoutOpen,onBack:()=>setCheckoutOpen(false),cart,promo,setPromo,form,setForm,onPay:pay,notify,busy}),
    h(Wheel,{open:wheelOpen,onClose:()=>setWheelOpen(false),notify}),
    h(ExitIntent,{open:exitOpen,onClose:()=>setExitOpen(false),onApply:(c)=>{ setPromo(SPECIAL[c]); setExitOpen(false); notify('Code '+c+' applied'); }}),
    h(RewardPicker,{open:rewardOpen,onClose:()=>setRewardOpen(false),onSelect:selectReward}),
    trackOrder && h(Tracking,{order:trackOrder,onClose:()=>setTrackOrder(null)}),
    legal && h(Legal,{topic:legal,onClose:()=>setLegal(null)}),
    payState && h(Modal,{onClose:()=>setPayState(null)},
      h('h2',{className:'display'}, payState.ok?'Acquisition Secured':'Payment Not Completed'),
      h('p',null, payState.ok
        ? 'Thank you. Your dossier '+payState.id+' is confirmed and will be dispatched within 24–48 hours.'
        : 'We could not confirm your payment. If money was debited it will be refunded automatically.'),
      h('button',{className:'btn block',onClick:()=>setPayState(null)}, payState.ok?'Continue':'Close')),
    user && h('div',{className:'vessel-float'},
      h('div',{className:'vt'},'Loyalty Vessel'),
      h('div',{className:'bar'},h('i',{style:{width:Math.min(100,loyaltyMl)+'%'}})),
      h('div',{className:'vm'},loyaltyMl+' / 100 ML'),
      loyaltyMl>=REWARD_ML && !cart.some(i=>i.isReward) && h('button',{onClick:claimReward},'Claim Reward')),
    h(Chat),
    h('div',{className:'toast'+(note?' show':'')}, note||'')
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
