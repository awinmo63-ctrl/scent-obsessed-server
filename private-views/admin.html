<html lang="en">

<style>
:root{--bone:#F4EFE7;--bone2:#ECE4D6;--ink:#1A1714;--ink2:#2C2822;--muted:#655D52;--line:#DED4C4;--cognac:#8A5A2C;--cognac2:#B27E48;
--ok:#2F6B45;--warn:#8A6A1F;--bad:#8C3A2E;--info:#2B5A7A;--card:#FFFDF9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bone);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
.display{font-family:'Fraunces',serif}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--cognac)}
.app{display:flex;min-height:100vh}
aside{width:224px;background:var(--ink);color:#B7AD9E;padding:22px 0;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:.3s}
aside .lg{padding:0 22px 22px;border-bottom:1px solid #35302A;margin-bottom:16px}
aside .lg b{display:block;color:var(--bone);font-size:13px;letter-spacing:.26em;text-transform:uppercase;font-weight:600}
aside .lg span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cognac2)}
aside nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
aside nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:none;color:#B7AD9E;padding:11px 12px;cursor:pointer;font-size:12.5px;letter-spacing:.06em;border-radius:3px;transition:.2s}
aside nav button:hover{background:#262019;color:var(--bone)}
aside nav button.on{background:var(--cognac);color:#fff}
aside nav button .pill{background:rgba(255,255,255,.16);padding:2px 7px;border-radius:9px;font-size:10px;font-weight:600}
aside .out{padding:16px 22px 0;margin-top:16px;border-top:1px solid #35302A}
aside .out button{background:none;border:1px solid #4A4238;color:#B7AD9E;padding:9px 14px;width:100%;cursor:pointer;font-size:11px;letter-spacing:.16em;text-transform:uppercase;border-radius:3px}
aside .out button:hover{border-color:var(--cognac2);color:var(--cognac2)}
main{flex:1;margin-left:224px;min-width:0}
.top{background:rgba(244,239,231,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 26px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:14px}
.top h1{font-family:'Fraunces',serif;font-size:22px;font-weight:500}
.top .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.body{padding:24px 26px 60px}
.burger{display:none;background:none;border:1px solid var(--line);width:38px;height:38px;border-radius:3px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);padding:16px 16px 14px;border-radius:3px}
.stat .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:'Fraunces',serif;font-size:26px;margin-top:6px;line-height:1.1}
.stat .d{font-size:11px;color:var(--muted);margin-top:4px}
.stat.acc{border-color:var(--cognac);background:linear-gradient(160deg,#fff,#F7EFE2)}
.stat.acc .v{color:var(--cognac)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:20px}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h h3{font-family:'Fraunces',serif;font-size:16px;font-weight:500}
.panel-b{padding:18px}
.panel-b.flush{padding:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--bone2)}
.tools input,.tools select{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:3px;outline:none;min-height:38px}
.tools input:focus,.tools select:focus{border-color:var(--cognac)}
.tools input[type=search]{min-width:230px;flex:1}
.btn{background:var(--ink);color:var(--bone);border:1px solid var(--ink);padding:9px 15px;border-radius:3px;cursor:pointer;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;min-height:38px;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sm{padding:6px 11px;min-height:32px;font-size:10.5px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.acc{background:var(--cognac);border-color:var(--cognac);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bone2);white-space:nowrap;font-weight:600}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#FBF7F0}
tr.sel td{background:#F5EDE0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.tag{display:inline-block;padding:3px 9px;border-radius:11px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.t-ok{background:rgba(47,107,69,.12);color:var(--ok)}
.t-warn{background:rgba(138,106,31,.14);color:var(--warn)}
.t-bad{background:rgba(140,58,46,.12);color:var(--bad)}
.t-info{background:rgba(43,90,122,.12);color:var(--info)}
.t-mut{background:rgba(101,93,82,.12);color:var(--muted)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:'Fraunces',serif;font-size:17px;color:var(--ink);margin-bottom:6px;font-weight:500}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:20px}
.chart svg{width:100%;height:auto;display:block}
.bar{fill:var(--cognac);transition:.2s}
.bar:hover{fill:var(--ink)}
.axis{font-size:9px;fill:var(--muted)}
.gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px}
.legend i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.scrim{position:fixed;inset:0;background:rgba(26,23,20,.5);z-index:80}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bone);z-index:81;display:flex;flex-direction:column;border-left:1px solid var(--line);animation:sl .3s ease}
@keyframes sl{from{transform:translateX(100%)}to{transform:none}}
.dw-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dw-h h3{font-family:'Fraunces',serif;font-size:19px;font-weight:500}
.dw-h .x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.dw-b{flex:1;overflow-y:auto;padding:20px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 14px;font-size:13px;margin-bottom:18px}
.kv dt{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.kv dd{word-break:break-word}
.sub-h{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cognac);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tl{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tl .dot{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:5px;flex-shrink:0}
.tl .dot.on{background:var(--cognac)}
.tl .tt{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tl .td{font-size:11.5px;color:var(--muted);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(26,23,20,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
.mb{background:var(--bone);border:1px solid var(--line);width:100%;max-width:420px;padding:24px;border-radius:3px}
.mb h3{font-family:'Fraunces',serif;font-size:19px;margin-bottom:14px}
.f{width:100%;border:1px solid var(--line);background:#fff;padding:11px;border-radius:3px;outline:none;margin-bottom:10px}
.f:focus{border-color:var(--cognac)}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--bone);padding:13px 22px;border-radius:3px;font-size:12px;opacity:0;transition:.3s;z-index:130;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 18px;background:#F5EDE0;border-bottom:1px solid var(--line);font-size:12.5px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--cognac);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.load{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:900px){
 aside{transform:translateX(-100%)}
 aside.open{transform:none}
 main{margin-left:0}
 .burger{display:block}
 .charts{grid-template-columns:1fr}
 .body{padding:16px 14px 60px}
 .top{padding:12px 14px}
 .kv{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>
<div id="root"><div class="load"><span class="spin"></span></div></div>
<script type="module">
import React,{useState,useEffect,useMemo,useCallback} from 'react';
import ReactDOM from 'react-dom/client';
const h=React.createElement;

const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const isPaid=o=>o.payment_status==='SUCCESS'||o.payment_status==='PAID';
const dstr=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}):'—';
const dtstr=d=>d?new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const daysAgo=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d;};
const parseAddr=a=>{try{return typeof a==='string'?JSON.parse(a):(a||{});}catch(e){return {};}};
const addrStr=a=>{const x=parseAddr(a);return [x.street,x.city,x.state,x.pincode].filter(Boolean).join(', ')||'—';};

async function api(url,opts){
  const r=await fetch(url,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));
  if(r.status===401||(r.redirected&&r.url.includes('login'))){window.location.href='/login.html';return null;}
  try{return await r.json();}catch(e){return null;}
}
function csv(rows,name){
  if(!rows.length)return;
  const heads=Object.keys(rows[0]);
  const esc=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const out=[heads.join(',')].concat(rows.map(r=>heads.map(k=>esc(r[k])).join(','))).join('\n');
  const b=new Blob([out],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
}

const STATUS_TAG={PREPARING:'t-warn',SHIPPED:'t-info',DELIVERED:'t-ok',CANCELLED:'t-bad'};

const BarChart=({data,height=190})=>{
  if(!data.length)return h('div',{className:'empty'},'No data yet');
  const max=Math.max(...data.map(d=>d.v),1),W=680,H=height,pl=46,pb=26,pt=10;
  const bw=(W-pl-10)/data.length;
  return h('div',{className:'chart'},h('svg',{viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'none',style:{height:H+'px'}},
    [0,.5,1].map((f,i)=>{const y=pt+(H-pt-pb)*(1-f);
      return h('g',{key:i},h('line',{x1:pl,x2:W-4,y1:y,y2:y,className:'gl'}),
        h('text',{x:4,y:y+3,className:'axis'},money(Math.round(max*f))));}),
    data.map((d,i)=>{const bh=Math.max(1,(H-pt-pb)*(d.v/max)),x=pl+i*bw+bw*.16,y=H-pb-bh;
      return h('g',{key:i},
        h('rect',{className:'bar',x:x,y:y,width:bw*.68,height:bh,rx:2},h('title',null,d.k+': '+money(d.v))),
        data.length<=14?h('text',{x:x+bw*.34,y:H-8,className:'axis',textAnchor:'middle'},d.k):null);})));
};

const Donut=({slices})=>{
  const tot=slices.reduce((s,x)=>s+x.v,0);
  if(!tot)return h('div',{className:'empty'},'No data yet');
  let off=0;const R=54,C=2*Math.PI*R;
  return h('div',null,
    h('svg',{viewBox:'0 0 140 140',style:{height:'150px',margin:'0 auto',display:'block'}},
      h('g',{transform:'rotate(-90 70 70)'},slices.filter(s=>s.v>0).map((s,i)=>{
        const len=C*(s.v/tot);
        const el=h('circle',{key:i,cx:70,cy:70,r:R,fill:'none',stroke:s.c,strokeWidth:20,
          strokeDasharray:len+' '+(C-len),strokeDashoffset:-off},h('title',null,s.k+': '+s.v));
        off+=len;return el;})),
      h('text',{x:70,y:76,textAnchor:'middle',style:{fontFamily:'Fraunces,serif',fontSize:'22px',fill:'var(--ink)'}},tot)),
    h('div',{className:'legend'},slices.map((s,i)=>h('div',{key:i},h('i',{style:{background:s.c}}),
      h('span',null,s.k),h('b',{style:{marginLeft:'auto'}},s.v)))));
};

const OrderDrawer=({order,onClose,onAction,busy,notify})=>{
  if(!order)return null;
  const a=parseAddr(order.shipping_address);
  const items=Array.isArray(order.cart_items)?order.cart_items:[];
  const st=order.tracking_status||'PREPARING';
  const steps=[{t:'Preparing',d:'Order received'},{t:'Shipped',d:order.awb_code?('AWB '+order.awb_code):'Handed to courier'},{t:'Delivered',d:'Completed'}];
  const idx=st==='DELIVERED'?2:st==='SHIPPED'?1:0;
  return h(React.Fragment,null,h('div',{className:'scrim',onClick:onClose}),
    h('aside',{className:'dw'},
      h('div',{className:'dw-h'},
        h('div',null,h('h3',{className:'display'},order.customer_name||'Guest'),
          h('div',{className:'mono',style:{color:'var(--muted)',marginTop:'3px'}},order.order_id)),
        h('button',{className:'x',onClick:onClose},'×')),
      h('div',{className:'dw-b'},
        h('div',{style:{display:'flex',gap:'8px',marginBottom:'18px',flexWrap:'wrap'}},
          h('span',{className:'tag '+(isPaid(order)?'t-ok':order.payment_status==='CANCELLED'?'t-bad':'t-warn')},
            isPaid(order)?'Paid':(order.payment_status||'Pending')),
          h('span',{className:'tag '+(STATUS_TAG[st]||'t-mut')},st),
          order.applied_promo?h('span',{className:'tag t-info'},order.applied_promo):null),
        h('dl',{className:'kv'},
          h('dt',null,'Placed'),h('dd',null,dtstr(order.created_at)),
          h('dt',null,'Email'),h('dd',null,order.customer_email||'—'),
          h('dt',null,'Phone'),h('dd',null,order.customer_phone||'—'),
          h('dt',null,'Address'),h('dd',null,addrStr(order.shipping_address)),
          h('dt',null,'Pincode'),h('dd',{className:'mono'},a.pincode||'—')),
        h('div',{className:'sub-h'},'Items'),
        items.length?items.map((it,i)=>h('div',{className:'li',key:i},
          h('span',null,(it.qty||1)+' × '+it.name),
          h('span',{style:{color:it.isReward?'var(--cognac)':'inherit'}},it.isReward?'Reward':it.price))):h('div',{style:{color:'var(--muted)'}},'No item detail'),
        h('div',{className:'li',style:{fontFamily:'Fraunces,serif',fontSize:'17px',borderBottom:'none'}},
          h('span',null,'Total'),h('span',null,money(order.total_amount))),
        h('div',{className:'sub-h'},'Loyalty'),
        h('dl',{className:'kv'},
          h('dt',null,'Earned'),h('dd',null,(order.reward_ml||0)+' ml'),
          h('dt',null,'Redeemed'),h('dd',null,(order.claimed_reward_ml||0)+' ml')),
        h('div',{className:'sub-h'},'Fulfilment'),
        steps.map((s,i)=>h('div',{className:'tl',key:i},h('div',{className:'dot'+(i<=idx?' on':'')}),
          h('div',null,h('div',{className:'tt'},s.t),h('div',{className:'td'},s.d)))),
        order.label_url?h('a',{className:'btn ghost',href:order.label_url,target:'_blank',rel:'noopener',
          style:{display:'inline-block',marginTop:'14px',textDecoration:'none'}},'Download Label PDF'):null,
        h('div',{className:'sub-h'},'Actions'),
        h('div',{className:'acts'},
          !isPaid(order)&&h('button',{className:'btn sm',disabled:busy,onClick:()=>onAction('mark-paid',order)},'Mark Paid'),
          isPaid(order)&&!order.awb_code&&h('button',{className:'btn acc sm',disabled:busy,onClick:()=>onAction('dispatch',order)},busy?'Dispatching…':'Dispatch via Shiprocket'),
          h('button',{className:'btn ghost sm',disabled:busy,onClick:()=>onAction('SHIPPED',order)},'Mark Shipped'),
          h('button',{className:'btn ghost sm',disabled:busy,onClick:()=>onAction('DELIVERED',order)},'Mark Delivered'),
          h('button',{className:'btn danger sm',disabled:busy,onClick:()=>{if(confirm('Cancel this order?'))onAction('CANCELLED',order);}},'Cancel'),
          h('button',{className:'btn ghost sm',onClick:()=>{navigator.clipboard.writeText(
            [order.customer_name,order.customer_phone,addrStr(order.shipping_address)].join('\n'));notify('Address copied');}},'Copy Address')))));
};

const App=()=>{
  const [tab,setTab]=useState('dash');
  const [nav,setNav]=useState(false);
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState(false);
  const [note,setNote]=useState(null);
  const [orders,setOrders]=useState([]);
  const [customers,setCustomers]=useState([]);
  const [promos,setPromos]=useState([]);
  const [leads,setLeads]=useState([]);
  const [surveys,setSurveys]=useState([]);
  const [reviews,setReviews]=useState([]);
  const [subs,setSubs]=useState([]);
  const [prods,setProds]=useState([]);
  const [editP,setEditP]=useState(null);
  const [detail,setDetail]=useState(null);
  const [sel,setSel]=useState([]);
  const [q,setQ]=useState('');
  const [fStatus,setFStatus]=useState('ALL');
  const [fRange,setFRange]=useState('30');
  const [promoModal,setPromoModal]=useState(false);
  const [pCode,setPCode]=useState('');
  const [pDisc,setPDisc]=useState('');

  const notify=useCallback(m=>{setNote(m);setTimeout(()=>setNote(null),3000);},[]);

  const load=useCallback(async()=>{
    setLoading(true);
    const res=await Promise.all([
      api('/api/admin/orders'),api('/api/admin/customers'),
      api('/api/admin/marketing'),api('/api/admin/surveys'),
      api('/api/admin/reviews'),api('/api/admin/newsletter'),api('/api/admin/products')]);
    const o=res[0],c=res[1],m=res[2],s=res[3],rv=res[4],nb=res[5],pr=res[6];
    if(pr&&pr.products)setProds(pr.products);
    if(rv&&rv.reviews)setReviews(rv.reviews);
    if(nb&&nb.subscribers)setSubs(nb.subscribers);
    if(o&&o.orders)setOrders(o.orders);
    if(c&&c.customers)setCustomers(c.customers);
    if(m){setPromos(m.promos||[]);setLeads(m.leads||[]);}
    if(s&&s.surveys)setSurveys(s.surveys);
    setLoading(false);
  },[]);
  useEffect(()=>{load();},[load]);

  const paid=useMemo(()=>orders.filter(isPaid),[orders]);
  const pending=useMemo(()=>orders.filter(o=>o.payment_status==='PENDING'),[orders]);
  const revenue=useMemo(()=>paid.reduce((s,o)=>s+(Number(o.total_amount)||0),0),[paid]);
  const since=useCallback(d=>paid.filter(o=>new Date(o.created_at)>=d),[paid]);
  const revToday=useMemo(()=>since(daysAgo(0)).reduce((s,o)=>s+(Number(o.total_amount)||0),0),[since]);
  const revWeek=useMemo(()=>since(daysAgo(6)).reduce((s,o)=>s+(Number(o.total_amount)||0),0),[since]);
  const revMonth=useMemo(()=>since(daysAgo(29)).reduce((s,o)=>s+(Number(o.total_amount)||0),0),[since]);
  const aov=paid.length?revenue/paid.length:0;

  const daily=useMemo(()=>{
    const out=[];
    for(let i=13;i>=0;i--){
      const d=daysAgo(i),n=daysAgo(i-1);

          h('div',{className:'stat'},h('div',{className:'l'},'Converted'),h('div',{className:'v'},leadStats.conv),h('div',{className:'d'},'Phone matched an order')),

        h('div',{className:'panel'},
          h('div',{className:'panel-h'},h('h3',{className:'display'},'Vault entries'),
            h('button',{className:'btn ghost sm',onClick:()=>csv(leads.map(l=>({phone:l.phone,prize:l.prize_won,date:l.created_at})),'leads.csv')},'Export CSV')),
          h('div',{className:'tw'},leads.length?h('table',null,
            h('thead',null,h('tr',null,['Phone','Prize','Captured','Status'].map((x,i)=>h('th',{key:i},x)))),
            h('tbody',null,leads.map((l,i)=>{
              const conv=orders.some(o=>String(o.customer_phone||'').slice(-10)===String(l.phone||'').slice(-10));
              return h('tr',{key:i},h('td',{className:'mono'},l.phone),h('td',null,l.prize_won||'—'),
                h('td',null,dtstr(l.created_at)),
                h('td',null,h('span',{className:'tag '+(conv?'t-ok':'t-mut')},conv?'Ordered':'Not yet')));}))
          ):h('div',{className:'empty'},h('b',null,'No leads yet'),'Vault entries appear here.'))),
        h('div',{className:'panel'},h('div',{className:'panel-h'},h('h3',{className:'display'},'Why people left')),
          h('div',{className:'panel-b'},(function(){
            const c={};surveys.forEach(s=>{c[s.reason||'—']=(c[s.reason||'—']||0)+1;});

            return rows.length?h(BarChart,{data:rows.map(r=>({k:r[0],v:r[1]})),height:150}):h('div',{className:'empty'},'No survey answers yet');
          })()))),

      tab==='promos'&&h('div',{className:'panel'},
        h('div',{className:'panel-h'},h('h3',{className:'display'},'Promo codes'),
          h('button',{className:'btn acc sm',onClick:()=>setPromoModal(true)},'New Code')),
        h('div',{className:'tw'},promos.length?h('table',null,
          h('thead',null,h('tr',null,['Code','Discount','Status','Times used',''].map((x,i)=>h('th',{key:i},x)))),
          h('tbody',null,promos.map(p=>h('tr',{key:p.id},
            h('td',{className:'mono'},p.code),h('td',null,(p.discount_percentage||0)+'%'),
            h('td',null,h('span',{className:'tag '+(p.is_used?'t-bad':'t-ok')},p.is_used?'Used':'Active')),
            h('td',null,promoUse[p.code]||0),
            h('td',null,h('button',{className:'btn danger sm',onClick:()=>delPromo(p.id)},'Delete')))))
        ):h('div',{className:'empty'},h('b',null,'No codes yet'),'Create one to run a campaign.'))),

      tab==='settings'&&h(React.Fragment,null,
        h('div',{className:'panel'},h('div',{className:'panel-h'},h('h3',{className:'display'},'Data export')),
          h('div',{className:'panel-b'},
            h('p',{style:{color:'var(--muted)',marginBottom:'14px'}},'Download your records for accounting, GST filing or courier bulk upload.'),
            h('div',{className:'acts'},
              h('button',{className:'btn ghost sm',onClick:()=>csv(orders.map(o=>({order_id:o.order_id,date:o.created_at,
                name:o.customer_name,email:o.customer_email,phone:o.customer_phone,address:addrStr(o.shipping_address),
                pincode:parseAddr(o.shipping_address).pincode||'',total:o.total_amount,payment:o.payment_status,
                fulfilment:o.tracking_status,awb:o.awb_code||'',promo:o.applied_promo||''})),'all-orders.csv')},'All orders'),
              h('button',{className:'btn ghost sm',onClick:()=>csv(customers.map(c=>({name:c.full_name,email:c.email,phone:c.phone,loyalty_ml:c.loyalty_ml})),'all-customers.csv')},'All customers'),
              h('button',{className:'btn ghost sm',onClick:()=>csv(leads.map(l=>({phone:l.phone,prize:l.prize_won,date:l.created_at})),'all-leads.csv')},'All leads'),
              h('button',{className:'btn ghost sm',onClick:()=>csv(subs.map(x=>({email:x.email,source:x.source,date:x.created_at})),'newsletter.csv')},'Newsletter ('+subs.length+')')))),
        h('div',{className:'panel'},h('div',{className:'panel-h'},h('h3',{className:'display'},'Courier connection')),
          h('div',{className:'panel-b'},
            h('p',{style:{color:'var(--muted)',marginBottom:'14px'}},'Checks that Shiprocket credentials work and couriers are serviceable. Books nothing.'),
            h('button',{className:'btn sm',disabled:busy,onClick:diagnose},busy?'Checking…':'Test Shiprocket'))),
        h('div',{className:'panel'},h('div',{className:'panel-h'},h('h3',{className:'display'},'Session')),
          h('div',{className:'panel-b'},
            h('p',{style:{color:'var(--muted)',marginBottom:'14px'}},'Admin sessions expire after 8 hours.'),
            h('button',{className:'btn danger sm',onClick:async()=>{await api('/api/admin/logout',{method:'POST'});window.location.href='/login.html';}},'Sign out'))))
      )),
    detail&&h(OrderDrawer,{order:detail,onClose:()=>setDetail(null),onAction:act,busy:busy,notify:notify}),
    editP&&h(React.Fragment,null,
      h('div',{className:'scrim',onClick:()=>setEditP(null)}),
      h('aside',{className:'dw'},
        h('div',{className:'dw-h'},
          h('h3',{className:'display'},editP._new?'New product':('Edit · '+editP.name)),
          h('button',{className:'x',onClick:()=>setEditP(null)},'×')),
        h('div',{className:'dw-b'},
          (function(){
            const f=(k,label,ph,type)=>h('div',{key:k,style:{marginBottom:'12px'}},
              h('label',{className:'lbl'},label),
              h('input',{className:'f',type:type||'text',placeholder:ph||'',value:editP[k]==null?'':editP[k],
                onChange:e=>setEditP(Object.assign({},editP,{[k]:type==='number'?e.target.value:e.target.value}))}));
            const ta=(k,label,ph,rows)=>h('div',{key:k,style:{marginBottom:'12px'}},
              h('label',{className:'lbl'},label),
              h('textarea',{className:'f',rows:rows||3,placeholder:ph||'',value:editP[k]==null?'':editP[k],
                onChange:e=>setEditP(Object.assign({},editP,{[k]:e.target.value}))}));
            return h(React.Fragment,null,
              h('div',{className:'sub-h'},'Essentials'),
              editP._new?f('id','URL id (cannot change later)','travel-set'):h('div',{style:{marginBottom:'12px'}},
                h('label',{className:'lbl'},'URL id'),h('div',{className:'mono'},editP.id)),
              f('name','Name','Travel & Gifting Set'),
              f('tagline','Tagline','Four signatures, pocket sized'),
              h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
                f('price','Price (₹)','2499','number'),
                f('volume_ml','Volume (ml)','20','number')),
              h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
                f('no','Display number','05'),
                f('sort_order','Sort order','50','number')),
              h('div',{className:'sub-h'},'Media'),
              f('img','Image filename or URL','travel_set.png'),
              h('p',{style:{fontSize:'11px',color:'var(--muted)',marginTop:'-6px',marginBottom:'12px'}},
                'Upload the image to the public folder in GitHub, then type its filename here.'),
              f('model','3D model file (optional)','travel_set.glb'),
              f('orientation','3D orientation','0deg 0deg 0deg'),
              h('div',{className:'sub-h'},'Description'),
              h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
                f('character','Character','Fresh & Woody'),
                f('wear','Best worn','Day to evening')),
              ta('intro','Short intro','One or two lines shown under the name',2),
              h('div',{className:'sub-h'},'Notes'),
              f('note_top','Top notes','Bergamot · Lemon'),
              f('note_heart','Heart notes','Jasmine · Ginger'),
              f('note_base','Base notes','Sandalwood · Amber'),
              h('div',{className:'sub-h'},'Long copy'),
              f('head','Headline','A line that sums up the dry-down'),
              ta('narrative','Full narrative','Use blank lines between paragraphs',7),
              h('div',{className:'sub-h'},'Visibility'),
              h('label',{style:{display:'flex',alignItems:'center',gap:'9px',fontSize:'13px',marginBottom:'16px'}},
                h('input',{type:'checkbox',checked:editP.is_active!==false,
                  onChange:e=>setEditP(Object.assign({},editP,{is_active:e.target.checked}))}),
                'Show on the storefront'),
              h('div',{className:'acts'},
                h('button',{className:'btn acc',disabled:busy,onClick:saveProduct},busy?'Saving…':(editP._new?'Create product':'Save changes')),
                h('button',{className:'btn ghost',onClick:()=>setEditP(null)},'Cancel')));
          })()))),
    promoModal&&h('div',{className:'modal',onClick:e=>{if(e.target.className==='modal')setPromoModal(false);}},
      h('div',{className:'mb'},h('h3',{className:'display'},'New promo code'),
        h('label',{className:'lbl'},'Code'),
        h('input',{className:'f',placeholder:'e.g. DIWALI20',value:pCode,onChange:e=>setPCode(e.target.value.toUpperCase())}),
        h('label',{className:'lbl'},'Discount %'),
        h('input',{className:'f',type:'number',min:'1',max:'100',placeholder:'20',value:pDisc,onChange:e=>setPDisc(e.target.value)}),
        h('div',{className:'acts'},h('button',{className:'btn acc sm',onClick:savePromo},'Create'),
          h('button',{className:'btn ghost sm',onClick:()=>setPromoModal(false)},'Cancel')))),
    h('div',{className:'toast'+(note?' show':'')},note||''));
};
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
